name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install development tools
        run: python -m pip install pytest ruff mypy
      - name: Synthetic-identifier guard
        run: python scripts/check_synthetic_identifiers.py
      - name: Format
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Types
        run: mypy .
      - name: Tests (offline; no test makes a network request)
        run: python -m pytest
